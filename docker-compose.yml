# CECODES - Huella de Carbono
#
#   cp .env.example .env   # then uncomment anything you want to override
#   docker compose up -d --build
#
# Nothing in that .env has to be filled in for this to work: every variable below already carries
# a default, and .env.example ships with the lines that would replace one commented out. The one
# thing you must read rather than set is the admin password, which init generates and prints once
# (see the init service, and `docker compose logs init`).
#
# On a developer machine that already has .env.local, point compose at it so its overrides reach
# ${...} substitution too (env_file feeds the containers; --env-file feeds ${...} substitution):
#
#   docker compose --env-file .env.local up -d --build
#
# Four containers by default:
#   db      Postgres, with a named volume. DATABASE_URL can point at this container or at any
#           other Postgres; nothing here is Supabase-specific any more.
#   init    runs once, applies pending migrations and seeds, then exits 0
#   app     starts only after init succeeds
#   mailpit catches password-reset mail so there is something to read with no provider account.
#           A production deployment sets MAIL_TRANSPORT=resend and RESEND_API_KEY instead, at
#           which point this container simply sits idle.
#
# Identity lives in this database now too: app_users holds the password hash, user_sessions
# holds the session. Nothing here talks to a third party for authentication.
#
# Add TLS with:  docker compose --profile edge up -d
# Useful:        docker compose logs -f init     (the whole initialization story, in order)

name: cecodes

services:
  # -------------------------------------------------------------------------------------------
  # db - the application database
  # -------------------------------------------------------------------------------------------
  # Published on 127.0.0.1 ONLY, never 0.0.0.0 - the same rule mailpit follows below, and for the
  # same reason. The short form "5432:5432" would publish the database to the internet on a VPS,
  # which is how one ends up in a botnet's scan results the same afternoon. Bound to loopback it
  # is reachable only from a process already on this host.
  #
  # It is published at all because the host-side tooling has no other route to it: `bun run dev`,
  # the Vitest suite, the Playwright suite and every `bun run db:*` script (prisma migrate deploy,
  # seed, import-factors, studio) run on the HOST, not inside this network, and cannot resolve the
  # "db" hostname. Containers reach it as db:5432 and ignore this mapping entirely.
  #
  # 55432 rather than 5432, because a developer machine very often already runs a native Postgres
  # on 5432 (this one does), and the bind then fails with a Windows socket-permission error that
  # names neither the port nor the conflict. A non-default host port cannot collide with it, and
  # costs only the ":55432" in the connection string that .env.local-testing already carries.
  #
  # The password below is a default rather than a secret. On a multi-user host, loopback is not a
  # boundary between local accounts: override POSTGRES_PASSWORD in .env there.
  db:
    image: postgres:17-alpine
    # DB_HOST_BINDING exists because a port conflict is fatal to the WHOLE deployment: compose
    # refuses to start any service when one binding fails, so a server already using 55432 could
    # not run this stack at all. Override it in .env, e.g. DB_HOST_BINDING=127.0.0.1:55433.
    # Keep the 127.0.0.1 prefix: the bare form "55432" binds 0.0.0.0 and publishes the database.
    ports:
      - "${DB_HOST_BINDING:-127.0.0.1:55432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cecodes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cecodes-local-dev}
      POSTGRES_DB: ${POSTGRES_DB:-cecodes}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -U matters: pg_isready defaults to the OS user (root), which is not a Postgres role here,
      # so without it the probe fails on a perfectly healthy database.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cecodes} -d ${POSTGRES_DB:-cecodes}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [internal]

  # -------------------------------------------------------------------------------------------
  # mailpit - a mail server that catches everything and delivers nothing
  # -------------------------------------------------------------------------------------------
  # The default transport, so `docker compose up -d` gives a working password-reset flow with no
  # provider account. Read the messages at http://127.0.0.1:8025.
  #
  # A production deployment sets MAIL_TRANSPORT=resend and RESEND_API_KEY, at which point this
  # container simply sits idle, or is skipped with `--scale mailpit=0`.
  mailpit:
    image: axllent/mailpit:v1.31.0
    # BOTH ports bound to 127.0.0.1, never 0.0.0.0. The short form "1025:1025" would publish an
    # open relay to the internet on a VPS, which is found by scanners within hours.
    #
    # SMTP is published at all because `bun run dev` and the Playwright suite run on the HOST, not
    # inside this network, and the reset spec needs somewhere to deliver. Containers reach it as
    # mailpit:1025 and ignore this mapping.
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped
    networks: [internal]

  # -------------------------------------------------------------------------------------------
  # init - one-shot initialization job
  # -------------------------------------------------------------------------------------------
  # Runs to completion and stops. This is what makes initialization safe with no coordination:
  # there is exactly ONE container that migrates, so the "three API replicas all run migrations
  # at once" race cannot occur. (prisma migrate deploy also takes a Postgres advisory lock, so
  # this is the second lock on the same door.)
  #
  # Everything it does is forward-only and idempotent. It never drops, truncates or resets.
  #
  # It also creates the first admin, and with ADMIN_PASSWORD unset (the default, because a
  # password published in a repository is a backdoor rather than a convenience) prisma/seed.ts
  # generates one and prints it in this container's log, once, on the run that creates the row.
  # `docker compose logs init` is therefore not only where initialization is explained, it is
  # where the only credential into a fresh system is handed over.
  init:
    build:
      context: .
      target: migrator
    # Either file, neither required at parse time. A deployed server has .env; a developer's
    # machine already has .env.local full of the same secrets, and asking them to keep a second
    # copy in step is how the two drift. Later entries win, so .env.local overrides .env locally.
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      # The default points at the db service above and is built from the same POSTGRES_* variables
      # it uses, so changing one cannot drift from the other. That default resolves with no
      # configuration at all, and is overridden by a project-root .env or by --env-file, because
      # those feed ${...} interpolation directly. An env_file: entry such as .env.local does NOT
      # override it: env_file only injects variables into the container's own environment, after
      # interpolation has already happened. To point THIS default at what .env.local names, run
      # `docker compose --env-file .env.local up -d`, as the file header above documents.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-cecodes}:${POSTGRES_PASSWORD:-cecodes-local-dev}@db:5432/${POSTGRES_DB:-cecodes}}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL:-postgresql://${POSTGRES_USER:-cecodes}:${POSTGRES_PASSWORD:-cecodes-local-dev}@db:5432/${POSTGRES_DB:-cecodes}}}
      # Both lines are character for character what the app service below sets, and kept that way
      # on purpose. init validates the whole runtime schema before it migrates anything
      # (validateInitEnv extends it), so SITE_URL's shape is checked HERE: a malformed override
      # fails initialization, which stops the app from starting at all, rather than surfacing in
      # the first password-reset mail nobody reads for a week. Validating a different string from
      # the one the app will read would make that check worthless. The reasoning behind the
      # expression itself is written out once, on the app service.
      SITE_URL: ${SITE_URL:-${DOMAIN:+https://}${DOMAIN:-http://localhost:3000}}
      DOMAIN: ${DOMAIN:-localhost}
      # src/lib/env.ts's runtimeSchema requires MAIL_FROM alongside whichever transport is
      # selected (SMTP_HOST for smtp, RESEND_API_KEY for resend). MAIL_TRANSPORT defaults to smtp
      # above, so MAIL_FROM needs a default here too, or every boot fails that check.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-CECODES <no-reply@localhost>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cecodes.local}
    depends_on:
      db:
        condition: service_healthy
    # restart:"no" is load-bearing, not a default. Any other policy would restart a job that
    # completed successfully, re-running the seed on a loop.
    restart: "no"
    networks: [internal]

  # -------------------------------------------------------------------------------------------
  # app - the Next.js application
  # -------------------------------------------------------------------------------------------
  app:
    build:
      context: .
      target: runner
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      # The default points at the db service above and is built from the same POSTGRES_* variables
      # it uses, so changing one cannot drift from the other. That default resolves with no
      # configuration at all, and is overridden by a project-root .env or by --env-file, because
      # those feed ${...} interpolation directly. An env_file: entry such as .env.local does NOT
      # override it: env_file only injects variables into the container's own environment, after
      # interpolation has already happened. To point THIS default at what .env.local names, run
      # `docker compose --env-file .env.local up -d`, as the file header above documents.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-cecodes}:${POSTGRES_PASSWORD:-cecodes-local-dev}@db:5432/${POSTGRES_DB:-cecodes}}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL:-postgresql://${POSTGRES_USER:-cecodes}:${POSTGRES_PASSWORD:-cecodes-local-dev}@db:5432/${POSTGRES_DB:-cecodes}}}
      # The origin in every emailed link (password reset, the admin's welcome mail).
      #
      # src/lib/site-url.ts reads SITE_URL FIRST and consults DOMAIN only when SITE_URL is absent.
      # So the constant this line used to hold, ${SITE_URL:-http://localhost:3000}, always
      # resolved and therefore outranked DOMAIN permanently: an operator who followed the
      # documented TLS path, DOMAIN in .env and `docker compose --profile edge up -d`, got working
      # HTTPS and every reset mail pointing at http://localhost:3000. Nothing failed anywhere. The
      # mail sent, the token row was written, and only the link was unreachable, which is a bug a
      # user reports and an operator cannot reproduce.
      #
      # The default is therefore conditional on DOMAIN rather than constant, and exactly one half
      # of it is ever non-empty: ${DOMAIN:+https://} contributes the scheme only when DOMAIN has a
      # value, and ${DOMAIN:-http://localhost:3000} contributes either that value or the whole
      # loopback URL this stack actually publishes when there is none. DOMAIN is a bare hostname,
      # the form the Caddyfile expects, and https://<hostname> is exactly the origin site-url.ts's
      # own DOMAIN branch would build, so the two can never disagree about the same deployment.
      #
      # An explicit SITE_URL still wins over both, which is what it is for: an address that is not
      # the DOMAIN, behind a path-based proxy or on a second hostname. And `docker compose up -d`
      # with no .env at all still gets http://localhost:3000 and mails links that work.
      SITE_URL: ${SITE_URL:-${DOMAIN:+https://}${DOMAIN:-http://localhost:3000}}
      # DOMAIN itself reaches the app, not only caddy's copy of it. site-url.ts documents DOMAIN as
      # its second choice and the compose default of "localhost" as a value it deliberately
      # ignores, which was true here only by accident: DOMAIN arrived through env_file when it came
      # from .env, and not at all when it came from the shell or another --env-file. The line above
      # normally answers first, so this is the standby rather than the main road: it is what
      # site-url.ts reads if SITE_URL ever arrives blank (env.ts reads whitespace as absent), and it
      # keeps `docker compose exec app env` an honest account of how this container is configured
      # rather than one variable short of it.
      DOMAIN: ${DOMAIN:-localhost}
      # src/lib/env.ts's runtimeSchema requires MAIL_FROM alongside whichever transport is
      # selected (SMTP_HOST for smtp, RESEND_API_KEY for resend). MAIL_TRANSPORT defaults to smtp
      # above, so MAIL_FROM needs a default here too, or every boot fails that check.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-CECODES <no-reply@localhost>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cecodes.local}
    depends_on:
      init:
        # The app does not start until init exits 0. A failed migration therefore means no app,
        # rather than an app serving requests against a half-migrated schema.
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    # Bound to loopback, not 0.0.0.0: on a public VPS the short form "3000:3000" would publish the
    # app directly to the internet, bypassing any reverse proxy and its TLS. Put Caddy (below) or
    # your own proxy in front. For a local trial, http://127.0.0.1:3000 still works.
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      # Hits readiness, which runs SELECT 1 through Prisma. Probing "/" instead would be a trap:
      # that route redirects (307), so a naive check passes while the database is down.
      # node:22 has global fetch, so this needs no curl in the image.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      # Generous, because a cold Next start plus the first database connection is not instant and
      # a container killed during startup never becomes healthy.
      start_period: 40s
      retries: 3
    networks: [internal]
    # DO NOT scale this above 1. unstable_cache and revalidatePath in
    # src/features/admin/lib/factor-library-cache.ts are per-process: with a second replica, an
    # admin editing the factor library invalidates only the replica that served the edit, and the
    # others keep serving stale factors until the entry expires. Vercel hides this behind a shared
    # cache layer; Compose does not.
    deploy:
      replicas: 1

  # -------------------------------------------------------------------------------------------
  # caddy - optional TLS terminator (profile: edge)
  # -------------------------------------------------------------------------------------------
  # Off by default so `docker compose up -d` stays at the four containers above and works with no
  # domain.
  # Enable once DNS points at this host: docker compose --profile edge up -d
  # Caddy obtains and renews a Let's Encrypt certificate on its own; set DOMAIN in .env.
  #
  # DOMAIN is not caddy's alone, and assuming it was is what once made a fully working HTTPS
  # deployment mail localhost links: init and app read it too, to build the origin in emailed
  # links. One hostname, set once, answers both questions.
  caddy:
    image: caddy:2-alpine
    profiles: [edge]
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks: [internal]

networks:
  # A private bridge. Nothing here publishes a database port to the host or the internet; db is
  # reachable only from other containers on this network, by service name.
  internal:
    driver: bridge

volumes:
  # The database. Losing this volume loses every company, entry and result, so it is named rather
  # than anonymous: `docker compose down` leaves it alone, and only `down -v` removes it.
  pgdata:
  # Certificates and OCSP staples. Losing this volume means re-issuing certificates on next start,
  # which Let's Encrypt rate-limits, so it is a named volume rather than anonymous.
  caddy_data:
  caddy_config:
